<style>
/* Layout: uma vitrine de loja — faixas largas, páginas de clientes expostas como produtos em celulares */
:root{
  /* Paleta branco e azul, tema claro fixo com alto contraste */
  --bg:#FFFFFF; --bg2:#F2F6FF; --card:#FFFFFF; --ink:#0A1A3F; --muted:#33415F; --line:#C9D6EE;
  --accent:#1652E0; --accent-ink:#FFFFFF; --navy:#0A1A3F; --sky:#D6E4FF; --sun:#9EC1FF; --soft:#E6EEFF; --ok:#0B7A47; --warn:#B3261E;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.disp{font-family:var(--display);text-wrap:balance;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* header */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:64px}
.logo{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.03em;display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.logo .mk{width:22px;height:22px;position:relative;display:inline-block}
.logo .mk::before,.logo .mk::after{content:"";position:absolute;inset:0;border-radius:6px}
.logo .mk::before{background:var(--accent);transform:translate(-3px,3px)}
.logo .mk::after{background:var(--sun);transform:translate(3px,-3px);mix-blend-mode:multiply;opacity:.95}
.logo b{color:var(--accent);margin-left:5px;font-size:.62em;letter-spacing:.06em;padding:3px 7px;border:2px solid var(--accent);border-radius:7px;line-height:1}
.navlinks{display:flex;gap:22px;margin-left:auto;align-items:center}
.navlinks a{text-decoration:none;color:var(--ink);font-weight:600}
.navlinks a:hover{color:var(--accent)}
.menu-btn{display:none;margin-left:auto;background:var(--card);border:1.5px solid var(--line);border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:20px;color:var(--ink)}
.mnav{display:none}
@media (max-width:520px){.hide-xs{display:none}}
@media (max-width:820px){
  .navlinks{display:none}.menu-btn{display:grid;place-items:center}
  .nav.open .mnav{display:grid;gap:4px;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg)}
  .mnav a{padding:12px 4px;font-weight:600;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
  .mnav .btn{margin-top:10px;color:var(--accent-ink)}
}
@media (max-width:600px){
  .sec{padding-block:56px}.sec-head{margin-bottom:28px}.sec-head p{font-size:16px}
  .hero{padding-block:36px 28px;gap:28px}.ctas .btn{flex:1 1 100%}
  .card{padding:20px}.price{font-size:40px}
  .dash-hd{padding-block:28px 18px}.dash-hd .btn{width:100%}
  .co{padding-block:24px}.auth{padding-block:28px 10px}
  .ropt{padding:14px;gap:10px}.ropt .v{font-size:14.5px}
  .buy{padding:22px}.buy .opt .r{text-align:left}
  .acct .btn{flex:1}
  .addmod{grid-template-columns:1fr 1fr}
  .final{border-radius:22px}
  .strip .rail{font-size:18px}
  .ed-top .wrap{gap:8px}.ed-top .btn-s{padding:8px 10px}
  .ph-prev{height:auto;min-height:0;max-height:none;border-width:0;border-radius:0;box-shadow:none}
  .ed-main{padding:0}.devices .seg{display:none}
}
@media (min-width:1400px){.wrap{max-width:1240px}}
/* ---------- celular: nada estoura a largura, alvos de toque maiores ---------- */
.hero>*,.grid3>*,.mods>*,.split>*,.idgrid>*,.adm-grid>*,.auth>*,.co>*,.plans>*,.steps>*,.resell>*,.ed>*,.ed-main,.ed-side,.devices,.pages>*{min-width:0}
#toast{left:16px;right:16px;margin-inline:auto;width:fit-content;transform:none;text-align:center}
.ph-prev{max-width:100%}
.ft nav a{padding-block:6px}
@media (pointer:coarse),(max-width:900px){
  html .ib{width:40px;height:40px}
  html .qty button{width:36px;height:36px;font-size:18px}
  html .mcats button{padding:.65em 1.05em;min-height:40px}
  html .seg button,html .wk button{min-height:40px}
  html .chips button{min-height:40px}
  html .days button{min-width:62px;padding:10px 6px}
  html .times button{padding:10px 14px;min-height:40px}
  html .icopt{height:44px}
  html .toggle input{width:48px;height:28px}
  html .toggle input::after{width:22px;height:22px}
  html .toggle input:checked::after{left:23px}
  html .lk-copy{padding:10px 0}
}
@media (max-width:600px){
  input,select,textarea{font-size:16px!important}
  .nav .wrap{gap:10px}
  .nav .pill{display:none}
  .logo{font-size:20px}
  .logo b{font-size:.6em}
  .ed-top .wrap{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .ed-top .crumb #ed-name{max-width:30vw}
  .ed-top .sync{display:none}
  .ed-main{padding:0!important}
  .ph-prev,.ph-prev.desk{width:100%!important;border:0!important;border-radius:0!important;box-shadow:none!important;height:auto!important;min-height:0!important}
  .ed-side{padding-bottom:90px}
  html .mrow .mh{flex-wrap:wrap;row-gap:8px}
  html .mrow .mh b{flex:1 1 calc(100% - 40px)}
  html .mrow .mh .ib:first-of-type{margin-left:auto}
  html .mit-top,html .lit-top,html .msec-hd{flex-wrap:wrap;row-gap:8px}
  html .mit-top input,html .lit-top input{flex:1 1 calc(100% - 52px)}
  html .msec-hd input{flex:1 1 100%}
  html .mit-top .ib:first-of-type,html .lit-top .ib:first-of-type,html .msec-hd .ib:first-of-type{margin-left:auto}
  .mrow .mh .ib{width:38px;height:38px}
  .mit-top .ib,.lit-top .ib,.msec-hd .ib{width:36px;height:36px}
  .mit-opts .upl{flex:1 1 auto;justify-content:center}
  .wk{gap:3px}.wk button{min-width:0;font-size:12px;padding-inline:0}
  input[type=time],input[type=number],select{min-width:0;max-width:100%}
  .field,.two>*{min-width:0}
  .modal .box{padding:20px;border-radius:20px}
  .tpls{grid-template-columns:1fr 1fr}
  .kpi b{font-size:28px}
  .acc .acts .btn{flex:1 1 auto}
  .dash-hd{align-items:stretch}
  .pcard .acts .btn{flex:1 1 auto}
  .h2{font-size:clamp(28px,8vw,40px)}
  .lead{font-size:16px}
  .cartbar{bottom:max(10px,env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){
  .nav .wrap{flex-wrap:wrap;height:auto;padding-block:10px;row-gap:8px}
  .nav .wrap>div{margin-left:0!important}
}
@media (max-width:360px){
  .tpls{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .loc-btns{grid-template-columns:1fr}
  .pm.v5 .lk,.pm.v5 .mn,.pm.v5 .sv,.mn-grade{grid-template-columns:1fr!important}
}


.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:600;border:1.5px solid transparent;cursor:pointer;text-decoration:none;font-size:15px;line-height:1.2;white-space:nowrap;transition:transform .15s ease,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-g{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-s{padding:8px 13px;font-size:14px;border-radius:10px}
.btn-d{background:transparent;border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-block{width:100%}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-block:64px 48px}
.h1{position:relative;z-index:0;font-size:clamp(42px,7vw,86px);line-height:.96;letter-spacing:-.035em;font-weight:800}
.h1 em{font-style:normal;color:var(--accent);position:relative;white-space:nowrap}
.h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.18em;background:var(--sky);z-index:-1;border-radius:3px}
.hero-note{margin-top:14px;font-size:14px;font-weight:600;color:var(--muted)}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:34em;margin-top:22px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.phones{position:relative;height:540px}
.phone{position:absolute;width:262px;height:520px;border-radius:38px;border:9px solid var(--ink);overflow:hidden;background:#fff;box-shadow:0 30px 60px -30px rgba(20,22,40,.5)}
.phone .scaler{width:375px;transform:scale(.6507);transform-origin:top left;pointer-events:none}
.phone.a{left:0;top:26px;transform:rotate(-5deg)}
.phone.b{right:0;top:0;transform:rotate(4deg)}
@media (max-width:900px){.hero{grid-template-columns:1fr}.phones{height:470px;max-width:520px;width:100%;margin:0 auto}.phone{width:220px;height:440px}.phone .scaler{transform:scale(.5387)}}
@media (max-width:460px){.phones{height:400px}.phone{width:188px;height:380px;border-width:7px}.phone .scaler{transform:scale(.464)}}

.strip{background:var(--accent);color:#FFFFFF;overflow:hidden;padding-block:16px;border-block:1px solid var(--ink)}
.strip .rail{display:flex;gap:34px;width:max-content;animation:rail 32s linear infinite;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.strip .rail span{display:inline-flex;gap:34px;align-items:center}
.strip .rail i{color:#BFD4FF;font-style:normal}
@keyframes rail{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.strip .rail{animation:none}}

.sec{padding-block:88px}
.sec-head{max-width:720px;margin-bottom:40px}
.h2{font-size:clamp(32px,4.8vw,56px);line-height:1.02;letter-spacing:-.03em;font-weight:800}
.h2 em{font-style:normal;color:var(--accent)}
.sec-head p{color:var(--muted);font-size:18px;margin-top:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:860px){.grid3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px}
.feat h3{font-size:24px;letter-spacing:-.02em;margin:14px 0 8px}
.feat .ic{width:46px;height:46px;border-radius:13px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}

.split{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.checks{list-style:none;padding:0;margin:24px 0 28px;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start}
.checks li::before{content:"✓";flex:none;width:22px;height:22px;margin-top:2px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:800}

.mock{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -40px rgba(20,22,40,.45)}
.mock-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--accent)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.draft{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.mock-body{display:grid;grid-template-columns:1fr 1fr;min-height:320px}
@media (max-width:520px){.mock-body{grid-template-columns:1fr}}
.mock-list{padding:18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.mrow-s{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-weight:600}
.mrow-s span{font-family:var(--mono);color:var(--accent);font-weight:700;font-size:12px;margin-right:8px}
.mock-prev{overflow:hidden;max-height:380px}
.mock-prev .scaler{width:375px;transform:scale(.78);transform-origin:top left;pointer-events:none}

.mods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:900px){.mods{grid-template-columns:1fr}}
.modcard{display:flex;flex-direction:column;gap:16px}
.modcard h3{font-size:22px;letter-spacing:-.02em}
.modcard .live{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}

.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media (max-width:900px){.idgrid{grid-template-columns:1fr}}
.idlist{display:grid;gap:14px}
.idlist .card{padding:20px}
.idlist h3{font-size:18px;margin-bottom:6px}
.idlist p{color:var(--muted);font-size:15px}
.ctrl{display:grid;gap:16px}
.ctrl .lbl{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:13.5px;font-weight:500}
.seg button.on{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);cursor:pointer;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;padding:0}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.sw i{display:block}
.idprev{border-radius:20px;overflow:hidden;border:1px solid var(--line);max-height:560px;overflow-y:auto}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;counter-reset:s}
@media (max-width:860px){.steps{grid-template-columns:1fr}}
.step{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#FFFFFF;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent);font-weight:600}
.step h3{font-size:24px;margin:10px 0 8px;letter-spacing:-.02em}

/* planos */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
@media (max-width:900px){.plans{grid-template-columns:1fr}}
.plan{position:relative;display:flex;flex-direction:column;gap:14px;background:var(--bg2);border:1.5px solid var(--line);border-radius:22px;padding:26px}
.plan.best{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.plan .tag{position:absolute;top:-12px;right:20px;background:var(--accent);color:#FFFFFF;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.plan .nm{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.price{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.price{color:var(--ink)}
.price small{font-size:16px;font-weight:700;color:var(--muted);letter-spacing:0}
.plan .how{font-size:15px;color:var(--ink);min-height:3em}
.plan .save{font-size:13px;font-weight:700;color:var(--ok)}
.plan .btn{margin-top:auto}
.same{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;color:var(--ink);font-weight:500;font-size:15px}
.same b{color:var(--ink)}

.final{background:linear-gradient(135deg,var(--accent),#0A3BB0);color:var(--accent-ink);border-radius:30px;padding:clamp(32px,6vw,72px);text-align:center}
.final .h2{color:var(--accent-ink)}
.final p{opacity:.95;margin:16px auto 28px;max-width:34em;font-size:18px}
.final .btn{background:var(--accent-ink);color:var(--accent)}

footer.ft{background:var(--bg2);border-top:1px solid var(--line);margin-top:80px;padding-block:40px}
.ft .wrap{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;align-items:flex-start}
.ft nav{display:flex;flex-wrap:wrap;gap:18px}
.ft nav a{text-decoration:none;color:var(--ink);font-weight:600}
.ft small{color:var(--muted);display:block;margin-top:8px}

/* páginas internas */
.page-hd{padding-block:64px 32px}
.prose{max-width:680px;display:grid;gap:18px;font-size:17px}
.prose h2{font-size:28px;margin-top:18px;letter-spacing:-.02em}
.form{display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label{font-size:14px;font-weight:600}
.field .hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=url],input[type=number],input[type=date],textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
textarea{min-height:110px;resize:vertical;font-family:var(--body);line-height:1.45}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.err{color:var(--warn);font-size:14px;font-weight:600}

/* login */
.auth{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;padding-block:48px 24px;align-items:start}
@media (max-width:900px){.auth{grid-template-columns:1fr}}
.tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:22px}
.tabs button{flex:1;padding:10px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.buy{background:var(--navy);color:#FFFFFF;border-radius:22px;padding:28px}
.buy h2{font-size:30px;letter-spacing:-.02em}
.buy p{opacity:.92;margin-top:8px}
.buy .opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-radius:14px;border:1.5px solid rgba(255,255,255,.35);margin-top:12px;cursor:pointer;background:rgba(255,255,255,.04);color:#FFFFFF;width:100%;text-align:left;flex-wrap:wrap}
.buy .opt:hover{border-color:var(--sun)}
.buy .opt b{font-family:var(--display);font-size:20px}
.buy .opt .r{text-align:right;font-variant-numeric:tabular-nums}
.buy .opt small{display:block;opacity:.9;font-size:12.5px}
.buy .opt .go{color:#9EC1FF;font-weight:700;font-size:14px}

/* checkout */
.co{display:grid;grid-template-columns:1.3fr .9fr;gap:28px;padding-block:40px;align-items:start}
@media (max-width:900px){.co{grid-template-columns:1fr}}
.co h2{font-size:22px;letter-spacing:-.01em;margin-bottom:14px}
.radio{display:grid;gap:10px}
.ropt{display:flex;gap:14px;align-items:center;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.ropt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.ropt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.ropt.on .dot{border:5px solid var(--accent)}
.ropt .t{flex:1;min-width:0}
.ropt .t b{display:block}
.ropt .t small{color:var(--muted);font-weight:500}
.ropt .v{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.sum{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.sum .row span{color:var(--muted);font-weight:600}.sum .row.tot span{color:var(--ink)}
.sum .row{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.sum .row.tot{border-bottom:0;font-weight:800;font-size:22px;color:var(--accent);font-family:var(--display)}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.demo-note{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13.5px}

/* painel */
.dash-hd{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;padding-block:40px 24px}
.dash-hd h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.03em}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.pcard .th{height:190px;overflow:hidden;border-bottom:1px solid var(--line);position:relative}
.pcard .th .scaler{width:375px;transform:scale(.72);transform-origin:top left;pointer-events:none}
.pcard .bd{padding:16px;display:grid;gap:10px}
.pcard .bd h3{font-size:19px}
.pcard .stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.newcard{border:2px dashed var(--line);border-radius:20px;display:grid;place-items:center;min-height:300px;cursor:pointer;background:transparent;font-weight:700;color:var(--muted)}
.newcard:hover{border-color:var(--accent);color:var(--accent)}
.adm .dash-hd{padding-bottom:16px}
.resell{display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,4vw,48px)}
@media (max-width:860px){.resell{grid-template-columns:1fr}}
.resell-num{display:grid;gap:12px}
.resell-num div{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:600}
.resell-num b{width:38px;height:38px;flex:none;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi span{display:block;font-size:13.5px;font-weight:600;color:var(--muted)}
.kpi b{display:block;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1;margin-top:4px}
.kpi.ok b{color:var(--ok)}.kpi.warn b{color:#9A5B00}.kpi.bad b{color:var(--warn)}
@media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
.adm-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:960px){.adm-grid{grid-template-columns:1fr}}
.adm-new{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
@media (max-width:960px){.adm-new{position:static}}
.dur{display:flex;gap:8px;margin-top:8px}.dur input{width:96px;flex:none;font-variant-numeric:tabular-nums;font-weight:700}.dur select{flex:1}
.cred pre{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;word-break:break-all;margin:10px 0 14px;color:var(--ink)}
.adm-tools{display:grid;gap:10px;margin-bottom:14px}
.adm-tools .seg button small{font-weight:700;opacity:.7;margin-left:2px}
.accs{display:grid;gap:12px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.acc-hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.acc-hd b{display:block;font-size:17px}
.acc-mail{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.acc-kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.acc-kv{grid-template-columns:1fr 1fr}}
.acc-kv div{background:var(--bg2);border-radius:10px;padding:8px 10px}
.acc-kv span{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.acc-kv b{font-size:15px;font-variant-numeric:tabular-nums}
.acc-note{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.st{flex:none;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.st-active{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.st-soon{background:#FFF1D6;color:#7A4A00}
.st-expired,.st-blocked{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn)}
.st-free{background:var(--soft);color:var(--accent)}
.empty{text-align:center;display:grid;gap:6px;padding:32px}
.sync{font-size:12.5px;font-weight:700;color:var(--ok);padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--ok) 10%,transparent)}
.sync[data-st="saving"]{color:var(--muted);background:var(--bg2)}.sync[data-st="error"]{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.reqs{margin-bottom:22px;display:grid;gap:4px}
.req{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.req b{display:block}.req-d{display:block;font-size:14px;font-weight:600;margin-top:2px}
.msgs{margin-top:16px}.msgs summary{cursor:pointer;display:flex;gap:8px;align-items:center}
.msg{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.msg p{margin-top:4px;white-space:pre-wrap}
.btn[disabled]{opacity:.6;pointer-events:none}
.adm-side{display:grid;align-content:start}
.adm-side .adm-new{position:static}
@media (min-width:961px){.adm-side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}}
.freebar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:20px}
.freebar b{display:block;font-family:var(--display);font-size:18px;color:var(--ink)}
.freebar span{color:var(--muted);font-size:15px}
.pw{display:grid;gap:10px;margin-top:18px}
.acct{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;margin-top:36px}
.acct .kv{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:14px}
.acct .kv span{color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,18,.55);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal .box{background:var(--card);border-radius:24px;padding:26px;width:min(780px,100%);max-height:90vh;overflow:auto}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:18px}
.tpl{border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;background:var(--card);text-align:left;display:grid;gap:6px}
.tpl:hover{border-color:var(--accent)}
.tpl-ph{display:block;aspect-ratio:16/9;border-radius:10px;background-size:cover;background-position:center;margin-bottom:4px}
.tpl b{font-family:var(--display);font-size:18px}
.tpl small{color:var(--muted)}
.tpl .bar{height:8px;border-radius:4px;display:flex;gap:3px}
.tpl .bar i{flex:1;border-radius:3px}

/* editor */
.ed-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.ed-top .wrap{max-width:none;display:flex;align-items:center;gap:12px;height:62px}
.ed-top .crumb{display:flex;gap:8px;align-items:center;min-width:0;font-weight:600}
.ed-top .crumb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.ed{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);min-height:calc(100vh - 62px)}
.ed-side{border-right:1px solid var(--line);background:var(--card);padding:18px max(16px,env(safe-area-inset-left,0px)) 60px 16px;overflow:auto;max-height:calc(100vh - 62px);position:sticky;top:62px}
.ed-main{display:flex;justify-content:center;padding:28px 16px;background:var(--bg2)}
.devices{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.ph-prev{width:min(390px,100%);height:min(760px,calc(100vh - 150px));min-height:520px;border:10px solid var(--ink);border-radius:42px;overflow:auto;background:#fff;box-shadow:0 30px 60px -30px rgba(20,22,40,.5)}
.ph-prev.desk{width:min(980px,100%);border-radius:16px;border-width:8px}
.ed-mob{display:none}
@media (max-width:900px){
  .ed{grid-template-columns:1fr}
  .ed-side{position:static;max-height:none;border-right:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ed-mob{display:flex;gap:4px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--line)}
  .ed-mob button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
  .ed-mob button.on{border-color:var(--accent);color:var(--accent);background:var(--soft)}
  .ed.show-prev .ed-side{display:none}
  .ed:not(.show-prev) .ed-main{display:none}
  .ed-top .hide-s{display:none}
}
.etabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.etabs button{padding:10px 12px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.etabs button.on{color:var(--ink);border-color:var(--accent)}
.ed-h{font-family:var(--display);font-size:21px;letter-spacing:-.02em;margin:4px 0 14px}
.mlist{display:grid;gap:10px}
.mrow{border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.mrow.open{border-color:var(--accent)}
.mrow .mh{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.mrow .mh .n{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--accent)}
.mrow .mh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:14px;line-height:1;flex:none}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.mrow .mb{padding:4px 12px 16px;display:grid;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.addmod{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.addmod button{padding:10px;border-radius:10px;border:1.5px dashed var(--line);background:transparent;cursor:pointer;font-weight:600;font-size:14px}
.addmod button:hover{border-color:var(--accent);color:var(--accent)}
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.colors label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer}
input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer;border-radius:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
.gal-ed{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gal-ed div{position:relative;aspect-ratio:1;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--line)}
.gal-ed button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:6px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:12px}
.upl{display:inline-flex;gap:8px;align-items:center;padding:9px 13px;border:1.5px dashed var(--line);border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
.upl input{display:none}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600}
.toggle input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;transition:background .2s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle input:checked{background:var(--ok)}
.toggle input:checked::after{left:21px}
.share{display:grid;gap:14px}
.copyrow{display:flex;gap:8px}
.copyrow input{flex:1;min-width:0;font-family:var(--mono);font-size:13px}
.qr{background:#fff;padding:14px;border-radius:14px;width:max-content;border:1px solid var(--line)}
.qr img,.qr canvas{display:block}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statgrid div{border:1px solid var(--line);border-radius:12px;padding:12px}
.statgrid b{display:block;color:var(--accent);font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}

/* visão pública */
/* barra */.pub-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:center;gap:10px;align-items:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--navy);color:#FFFFFF;font-size:13px;flex-wrap:wrap}
.pub-bar a{color:#9EC1FF;font-weight:700}
.pub-foot{text-align:center;padding:20px 16px 30px;font-size:12.5px;opacity:.7}
.pub-foot a{text-decoration:none;font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--navy);color:#FFFFFF;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* ====== páginas criadas pelos clientes (.pg) ====== */
.pg{--p-r:16px;--p-int:30%;background:var(--p-bg);color:var(--p-text);font-family:var(--p-fb);font-size:var(--p-size);line-height:1.5;min-height:100%;padding-block:18px 10px}
.pg.bg-luz{background:radial-gradient(130% 55% at 50% 0%,color-mix(in srgb,var(--p-accent) var(--p-int),var(--p-bg)) 0%,var(--p-bg) 75%)}
.pg.bg-dividido{background:linear-gradient(color-mix(in srgb,var(--p-accent) var(--p-int),var(--p-bg)) 0 230px,var(--p-bg) 230px)}
.pg.bg-lavado{background:linear-gradient(170deg,color-mix(in srgb,var(--p-accent) var(--p-int),var(--p-bg)) 0%,var(--p-bg) 65%)}
.pg h1,.pg h2,.pg h3{font-family:var(--p-fh);margin:0;line-height:1.1;letter-spacing:-.015em;text-wrap:balance}
.pg-in{max-width:var(--p-w);margin:0 auto;padding-inline:14px;display:flex;flex-direction:column;gap:var(--p-gap)}
.pm{position:relative;color:var(--p-text)}
.surf-cartoes .pm{background:var(--p-surface);border-radius:var(--p-r);padding:18px}
.surf-livre .pm{padding:6px 2px}
.surf-contorno .pm{border:1.5px solid color-mix(in srgb,var(--p-text) 22%,transparent);border-radius:var(--p-r);padding:18px}
.surf-elevado .pm{background:var(--p-surface);border-radius:var(--p-r);padding:18px;box-shadow:0 14px 34px -16px rgba(0,0,0,.32)}
.pm.pad-c{padding:12px}.pm.pad-g{padding:28px}
.pm.v2{background:color-mix(in srgb,var(--p-accent) 13%,var(--p-surface));padding:18px;border-radius:var(--p-r)}
.pm.v3{background:var(--p-text);color:var(--p-bg);padding:18px;border-radius:var(--p-r)}
.pm.v4{text-align:center}
.pm.v4 .pb{justify-content:center}
.pm h2{font-size:1.28em;margin-bottom:.7em}
.pm .sub{opacity:.85;font-size:.92em}
.pb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.85em 1.1em;background:var(--p-accent);color:var(--p-on);border:2px solid var(--p-accent);border-radius:var(--p-br);text-decoration:none;font:inherit;font-weight:600;cursor:pointer;width:100%;text-align:left}
.pg.btn-contorno .pb{background:transparent;color:var(--p-accent)}
.pm.v3 .pb{border-color:var(--p-accent)}
.pb.off{opacity:.45;cursor:not-allowed}
.pg .pb.inl{display:inline-flex;width:auto}
.kick{display:inline-block;font-size:.72em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--p-accent);margin-bottom:.4em}
.pm.v3 .kick{color:var(--p-accent)}
.cv-img{aspect-ratio:16/10;border-radius:calc(var(--p-r)*.75);background-size:cover;background-position:center;margin-bottom:16px;position:relative;overflow:hidden}
.cv-img .lg{position:absolute;left:14px;bottom:-1px;width:58px;height:58px;border-radius:16px;background:var(--p-surface);display:grid;place-items:center;font-family:var(--p-fh);font-weight:700;font-size:22px;color:var(--p-accent);transform:translateY(40%);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.cv h1{font-size:1.85em}
.cv p{margin-top:.5em;opacity:.9}
.cv .pb{margin-top:1em}
.cv.v2{padding:0!important;overflow:hidden;background:none}
.cv.v2 .cv-img{aspect-ratio:4/5;margin:0;border-radius:var(--p-r)}
.cv.v2 .cv-img::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.72))}
.cv.v2 .cv-tx{position:absolute;left:0;right:0;bottom:0;padding:20px;color:#fff;z-index:1}
.cv.v2 .lg{display:none}
.cv.v4 .cv-img{width:110px;aspect-ratio:1;border-radius:50%;margin:6px auto 16px}
.cv.v4 .lg{display:none}
.lk{display:grid;gap:10px}
.pm.v5 .lk{grid-template-columns:1fr 1fr}
.lkb .lk-t{flex:1;min-width:0}
.lkb.has-ic{justify-content:flex-start;gap:12px}
.lk-ic{width:2em;height:2em;flex:none;border-radius:calc(var(--p-br) * .6);display:grid;place-items:center;background:color-mix(in srgb,currentColor 16%,transparent);background-size:cover;background-position:center}
.pg[class] .lk-ic{border-radius:min(10px,var(--p-br))}

/* ---------- utilidades ---------- */
const brl = n => n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const safeUrl = u => { u = String(u||'').trim(); if(!u) return '#'; if(/^(https?:)?\/\//i.test(u)) return u; if(/^(mailto|tel):/i.test(u)) return u; if(u.startsWith('@')) return 'https://instagram.com/'+u.slice(1); return 'https://'+u; };
const parsePrice = p => { const n = parseFloat(String(p||'').replace(/[^\d,]/g,'').replace(',','.')); return isNaN(n)?null:n; };
const fmtPrice = p => { const n = parsePrice(p); return n===null ? (p||'Consultar') : brl(n); };
const wa = (num,msg) => { const n=String(num||'').replace(/\D/g,''); return n ? `https://wa.me/${n.length<=11?'55'+n:n}?text=${encodeURIComponent(msg)}` : null; };
function lum(hex){ const h=hex.replace('#',''); const c=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)); return .2126*c[0]+.7152*c[1]+.0722*c[2]; }
const onColor = hex => { try{ return lum(hex)>.45?'#141414':'#FFFFFF'; }catch(e){ return '#FFFFFF'; } };
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }

/* ---------- dados na nuvem (Supabase) ---------- */
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
let db = { session:null, users:{}, pages:[], pending:[], ready:false };
const me = () => db.session && db.users[db.session] ? db.users[db.session] : null;
const active = u => !!(u && !u.blocked && u.sub && new Date(u.sub.until) > new Date());
function toUser(p){
  if(!p) return null;
  return { id:p.id, name:p.name||'', email:p.email, blocked:!!p.blocked, is_admin:!!p.is_admin, free_used:!!p.free_used, note:p.note||'', created:p.created_at, pages:p.pages,
    role:p.role||'cliente', reseller_id:p.reseller_id||null, client_limit:p.client_limit||0, clients:p.clients||0, brand_name:p.brand_name||'', brand_url:p.brand_url||'',
    sub: p.access_until ? { plan:p.plan==='free'?'admin':p.plan, until:p.access_until, mode:p.pay_mode, method:p.pay_method, renew:false } : null };
}
function fromRow(r, brand){ return sanitizePage({ _brand: brand||db.brand||null, id:r.id, owner:r.owner, slug:r.slug, name:r.name, published:r.published, whatsapp:r.whatsapp||'', theme:{...defTheme(), ...(r.theme||{})}, mods:Array.isArray(r.mods)&&r.mods.length?r.mods:[mkMod('capa',{title:r.name})], free:r.is_free, stats:{views:r.views||0, clicks:r.clicks||0}, _savedSlug:r.slug }); }
const toRow = p => ({ slug:p.slug, name:p.name, published:!!p.published, whatsapp:p.whatsapp||'', theme:p.theme, mods:p.mods, updated_at:new Date().toISOString() });
async function loadSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ db.session=null; db.users={}; db.pages=[]; db.pending=[]; return; }
  const id=session.user.id;
  const [prof, pages, pend, brandR] = await Promise.all([
    sb.from('profiles').select('*').eq('id',id).single(),
    sb.from('pages').select('*').eq('owner',id).order('created_at'),
    sb.from('payment_requests').select('*').eq('user_id',id).eq('status','pendente').order('created_at',{ascending:false}),
    sb.rpc('page_brand',{p_owner:id}).then(r=>r,()=>null)
  ]);
  if(prof.error){ db.session=null; return; }
  db.session=id; db.users={[id]:toUser(prof.data)}; db.brand=(brandR&&brandR.data)||null;
  db.pages=(pages.data||[]).map(r=>fromRow(r)); db.pending=pend.data||[];
}
async function api(action, payload={}){
  const { data:{ session } } = await sb.auth.getSession();
  let res, j;
  try{
    res = await fetch(SB_URL+'/functions/v1/api', { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer '+(session?.access_token||SB_KEY) }, body:JSON.stringify({ action, ...payload }) });
    j = await res.json();
  }catch(e){ throw Object.assign(new Error('Sem conexão com o servidor. Confira sua internet e tente de novo.'),{code:'network'}); }
  if(!res.ok || j.error) throw Object.assign(new Error(j.error?.message||'Algo deu errado. Tente de novo.'),{code:j.error?.code});
  return j;
}
/* salvamento automático das páginas */
const dirty=new Set(); let syncT=null, syncing=false;
function setSync(st){ const el=$('#sync'); if(!el) return; el.dataset.st=st; el.textContent = st==='saving'?'Salvando…':st==='error'?'Não salvou':'Salvo'; }
function save(){ const p=curPage(); if(p && p.owner && p.owner===db.session){ dirty.add(p.id); setSync('saving'); clearTimeout(syncT); syncT=setTimeout(flush,800); } return true; }
async function flush(){
  if(syncing){ clearTimeout(syncT); syncT=setTimeout(flush,400); return; }
  syncing=true; let ok=true;
  for(const id of [...dirty]){
    dirty.delete(id); const p=db.pages.find(x=>x.id===id); if(!p) continue;
    const { error } = await sb.from('pages').update(toRow(p)).eq('id',id);
    if(error){
      ok=false;
      if(error.code==='23505'){ toast('Esse endereço já está em uso. Escolha outro.'); p.slug=p._savedSlug; const i=$('#pg-slug'); if(i) i.value=p.slug; dirty.add(id); }
      else if(error.code==='23514'){ toast('Endereço inválido: use letras, números e hífen.'); p.slug=p._savedSlug; dirty.add(id); }
      else { toast('Não foi possível salvar. Confira sua internet.'); dirty.add(id); }
    } else p._savedSlug=p.slug;
  }
  syncing=false; setSync(ok?'saved':'error');
  if(!ok && dirty.size){ clearTimeout(syncT); syncT=setTimeout(flush,5000); }
}
window.addEventListener('beforeunload', e=>{ if(dirty.size||syncing){ e.preventDefault(); e.returnValue=''; } });

/* ---------- temas ---------- */
const LOOKS = {
  claro:    {name:'Claro',    bg:'#FFFFFF', surface:'#F2F6FF', text:'#0A1A3F', accent:'#1652E0'},
  noite:    {name:'Azul noite', bg:'#0A1A3F', surface:'#132A5E', text:'#FFFFFF', accent:'#5B9BFF'},

  cafe:     {name:'Café',     bg:'#F3ECE4', surface:'#FFFAF4', text:'#3A271B', accent:'#7A4A2A'},

  oceano:   {name:'Oceano',   bg:'#E8F6FA', surface:'#FFFFFF', text:'#0B2E3A', accent:'#0E7C9B'}

const FONTS = {
  moderna:   {name:'Moderna',   h:"'Bricolage Grotesque',system-ui,sans-serif", b:"'Figtree',system-ui,sans-serif"},
  editorial: {name:'Editorial', h:"'Fraunces',Georgia,serif", b:"'Figtree',system-ui,sans-serif"},
  expressiva:{name:'Expressiva',h:"'Syne','Figtree',sans-serif", b:"'Figtree',system-ui,sans-serif"},
  tecnica:   {name:'Técnica',   h:"'IBM Plex Mono',ui-monospace,monospace", b:"'IBM Plex Mono',ui-monospace,monospace"},
  classica:  {name:'Clássica',  h:"'Playfair Display',Georgia,serif", b:"'Lora',Georgia,serif"},
  elegante:  {name:'Elegante',  h:"'DM Serif Display',Georgia,serif", b:"'Montserrat',system-ui,sans-serif"},

};
const FONT_CSS = { editorial:'Fraunces:opsz,wght@9..144,400;600', expressiva:'Syne:wght@500;700', classica:'Playfair+Display:wght@500;700&family=Lora:wght@400;600', elegante:'DM+Serif+Display&family=Montserrat:wght@400;600;700', forte:'Oswald:wght@500;600&family=Nunito:wght@400;600;700', amigavel:'Poppins:wght@400;600;700', manuscrita:'Caveat:wght@600;700&family=Nunito:wght@400;600;700' };
const FONT_LOADED = {};
function ensureFont(k){ if(!FONT_CSS[k] || FONT_LOADED[k]) return; FONT_LOADED[k]=1; try{ const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?family='+FONT_CSS[k]+'&display=swap'; document.head.appendChild(l); }catch(e){} }
const PHOTOSHAPE = {arred:'Arredondada', quadrado:'Quadrada', circulo:'Círculo'};

const IN_SANDBOX = /claude|anthropic|usercontent/i.test(location.hostname) || location.protocol==='file:' || location.protocol==='about:';

const defTheme = (look='claro') => ({look, ...pick(LOOKS[look]), font:'moderna', size:'equilibrado', width:'padrao', spacing:'equilibrado', surface:'cartoes', btn:'suave', btnFill:'cheio', radius:16, bgStyle:'solido', bgInt:30, photo:'arred', bgImage:'', surface:'cartoes'});
/* ---------- blindagem: todo conteúdo de página passa por aqui antes de aparecer ---------- */
const HEX_RE=/^#[0-9a-fA-F]{3,8}$/, ID_RE=/^[\w-]{1,40}$/;
const cleanId = v => ID_RE.test(String(v??'')) ? String(v) : uid();
const cleanStr = (v,n=4000) => v==null ? '' : String(v).slice(0,n);
function cleanUrl(u){
  u=String(u||'').trim();
  if(u.length<=3000000 && /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(u)) return u;
  if(u.length<=2000 && /^https:\/\/[^\s"'()<>\\`]+$/.test(u)) return u;
  if(/^img\/[\w.-]+$/.test(u)) return u;
  return '';
}
const KNOWN_ILL = n => typeof n==='string' && (!!PHOTOS[n] || !!(typeof ILLS!=='undefined' && ILLS[n]));
function cleanData(v, key, depth){
  if(depth>7) return null;
  if(key==='id') return cleanId(v);
  if(['image','logo','photo'].includes(key)) return cleanUrl(v);
  if(key==='icon'){ const x=String(v||''); return x.startsWith('i:') ? (LINK_ICONS[x.slice(2)]?x:'') : cleanUrl(x); }
  if(key==='images') return Array.isArray(v) ? v.slice(0,40).map(cleanUrl).filter(Boolean) : [];
  if(key==='ills') return Array.isArray(v) ? v.slice(0,12).filter(a=>Array.isArray(a)&&KNOWN_ILL(a[0])).map(a=>[a[0],cleanStr(a[1],40)]) : undefined;
  if(key==='ill') return KNOWN_ILL(v) ? v : '';
  if(key==='tone') return HEX_RE.test(v||'') ? v : '#1652E0';
  if(key==='tag') return Object.prototype.hasOwnProperty.call(TAGS, v||'') ? (v||'') : '';
  if(key==='layout') return MENULAYOUT[v] ? v : 'lista';
  if(key==='photos' && v && typeof v==='object' && !Array.isArray(v)){ const o={}; Object.keys(v).slice(0,200).forEach(k=>{ if(/^\d{1,3}$/.test(k)) o[k]=cleanUrl(v[k]); }); return o; }
  if(typeof v==='string') return cleanStr(v, key==='text'||key==='items'||key==='services'||key==='opts'?8000:2000);
  if(typeof v==='number') return Number.isFinite(v) ? v : 0;
  if(typeof v==='boolean' || v==null) return v;
  if(Array.isArray(v)) return v.slice(0,300).map(x=>cleanData(x, '', depth+1));
  if(typeof v==='object'){ const o={}; Object.keys(v).slice(0,60).forEach(k=>{ if(/^[\w.@-]{1,40}$/.test(k)){ const c=cleanData(v[k], k, depth+1); if(c!==undefined) o[k]=c; } }); return o; }
  return null;
}
function sanitizeTheme(t){
  t = (t && typeof t==='object') ? {...t} : {};
  if(BGS[t.bg]){ t.bgStyle=t.bg; delete t.bg; }
  if(HEX_RE.test(t.surface||'')){ t.card=t.surface; delete t.surface; }
  const look = LOOKS[t.look] ? t.look : 'claro', d=defTheme(look), o={...d};
  o.look = LOOKS[t.look] ? t.look : '';
  ['bg','card','text','accent'].forEach(k=>{ if(HEX_RE.test(t[k]||'')) o[k]=t[k]; });
  [['font',FONTS],['size',SIZES],['width',WIDTHS],['spacing',SPACING],['surface',SURFACES],['btn',BTNS],['btnFill',BTNFILL],['bgStyle',BGS],['photo',PHOTOSHAPE]].forEach(([k,map])=>{ if(Object.prototype.hasOwnProperty.call(map, t[k])) o[k]=t[k]; });
  o.radius = Math.min(30, Math.max(0, parseInt(t.radius ?? d.radius) || 0));
  o.bgInt = Math.min(80, Math.max(5, parseInt(t.bgInt ?? d.bgInt) || 30));
  o.bgImage = cleanUrl(t.bgImage);
  o.waFloat = t.waFloat===true;
  return o;
}
function sanitizeMods(mods){
  if(!Array.isArray(mods)) return [];
  return mods.slice(0,60).filter(m=>m && typeof m==='object' && Object.prototype.hasOwnProperty.call(MODS, m.type)).map(m=>({
    id:cleanId(m.id), type:m.type, v:Math.min(5,Math.max(1,parseInt(m.v)||1)), pad:['c','n','g'].includes(m.pad)?m.pad:'n',
    accent:HEX_RE.test(m.accent||'')?m.accent:'', hidden:!!m.hidden, data:cleanData(m.data&&typeof m.data==='object'?m.data:{}, '', 0) || {}
  }));
}
function sanitizePage(p){ if(!p) return p; p.theme=sanitizeTheme(p.theme); p.mods=sanitizeMods(p.mods); return p; }
function normTheme(t){ if(!t) return defTheme(); if(BGS[t.bg]){ t.bgStyle=t.bg; t.bg=(LOOKS[t.look]||LOOKS.claro).bg; } if(HEX_RE.test(t.surface||'')){ t.card=t.surface; t.surface='cartoes'; } if(!HEX_RE.test(t.card||'')) t.card=(LOOKS[t.look]||LOOKS.claro).surface; if(!t.bgStyle) t.bgStyle='solido'; if(!t.photo) t.photo='arred'; if(!SURFACES[t.surface]) t.surface='cartoes'; if(!FONTS[t.font]) t.font='moderna'; if(!SIZES[t.size]) t.size='equilibrado'; if(!WIDTHS[t.width]) t.width='padrao'; if(!SPACING[t.spacing]) t.spacing='equilibrado'; return t; }

      h = `${d.title?`<h2>${esc(d.title)}</h2>`:''}${idm ? ((IN_SANDBOX||ctx==='thumb') ? `<a class="vid vid-ph" href="https://www.youtube.com/watch?v=${idm[1]}" target="_blank" rel="noopener" style="${bgImg('https://i.ytimg.com/vi/'+idm[1]+'/hqdefault.jpg')}"><span class="vid-play">▶</span></a>` : `<div class="vid"><iframe title="Vídeo" loading="lazy" src="https://www.youtube.com/embed/${idm[1]}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`) : `<p class="sub">Cole o link de um vídeo do YouTube para ele aparecer aqui.</p>`}`;
      break; }
    case 'perguntas':
      h = `${d.title?`<h2>${esc(d.title)}</h2>`:''}<div class="fq">${rows(d.items).map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a||'')}</p></details>`).join('')}</div>`;
      break;
    case 'chamada':
      h = `<div class="ch"><h2>${esc(d.title)}</h2><p>${esc(d.text)}</p>${d.cta?`<a class="pb" href="${esc(lnk(d.link))}" target="_blank" rel="noopener" data-click>${esc(d.cta)} <span>↗</span></a>`:''}</div>`;
      break;
  }
  return modOpen(m)+h+'</section>';
}

function fieldHtml(m,k,lab,type){

  if(type==='color') return `<label class="colors"><span style="display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600"><input type="color" value="${esc(v||'#7C8CF8')}" data-f="mod:${m.id}:${k}"> ${lab}</span></label>`;
  if(type==='img') return `<div class="field"><label>${lab}</label><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label class="upl">Enviar foto<input type="file" accept="image/*" data-up="img:${m.id}:${k}"></label>${v?`<button class="btn btn-g btn-s" data-act="rmimg" data-id="${m.id}" data-f="${k}">Remover foto</button>`:''}</div></div>`;

      <div class="sub-lbl">Pagamento aceito</div><div class="tgl-row">${tg('pay.pix','Pix',o.pay?.pix)}${tg('pay.cartao','Cartão',o.pay?.cartao)}${tg('pay.dinheiro','Dinheiro',o.pay?.dinheiro)}</div>
      ${o.pay?.pix?`<div class="field"><label for="op-${mid}">Chave Pix (aparece para o cliente)</label><input type="text" id="op-${mid}" value="${esc(o.pix||'')}" placeholder="CNPJ, e-mail, telefone ou chave aleatória" data-f="ord:${mid}:pix"></div>`:''}

  }
  if(type==='agenda'){
    const d=m.data, mid=m.id; const wh=agWeek(d), ex=agExc(d);
    const opt=(v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${l}</option>`;
    const WEEKL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

    const sel=(S.agSel&&S.agSel[mid])||''; const selD=sel?new Date(sel+'T12:00:00'):null; const se=sel?ex[sel]:null;

    const stateOf=dt=>{ const iso=isoDay(dt), e=ex[iso]; if(dt<today) return 'past'; if(e&&e.mode==='fechado') return 'fech'; if(e&&e.mode==='especial') return 'esp'; return agDayInfo(d,dt).open ? (e&&e.off&&e.off.length?'blq':'aberto') : 'fech0'; };

function viewPublic(route){
  const [slug, extra] = String(route).split('/'); S.table = (extra||'').startsWith('mesa-') ? extra.slice(5) : '';
  let p = db.pages.find(x=>x.slug===slug) || DEMOS.find(x=>x.slug===slug) || S.pub[slug];
  if(p===undefined){
    S.pub[slug]=null;
    sb.from('pages').select('*').eq('slug',slug).maybeSingle().then(async ({data})=>{ let br=null; if(data){ try{ br=(await sb.rpc('page_brand',{p_owner:data.owner})).data; }catch(e){} } S.pub[slug]= data ? fromRow(data, br||{reseller:false}) : false; if(location.hash.startsWith('#p-'+slug)) render(); });
    return `<main class="wrap" style="padding-block:120px;text-align:center"><p class="muted">Carregando…</p></main>`;
  }
  if(p===null) return `<main class="wrap" style="padding-block:120px;text-align:center"><p class="muted">Carregando…</p></main>`;
  if(!p) return hdr()+`<main class="wrap" style="padding-block:100px;text-align:center"><h1 class="h2">Página não encontrada</h1><p class="muted" style="margin-top:12px">Confira o endereço ou volte para o início.</p><a class="btn btn-p" style="margin-top:22px" href="#inicio">Ir para o início</a></main>`;
  const owner = p.owner && p.owner===db.session;
  if(!p.published && !owner) return hdr()+`<main class="wrap" style="padding-block:100px;text-align:center"><h1 class="h2">Esta página ainda não foi publicada</h1></main>`;
  if(!p.demo && !owner && !S.viewed[p.id]){ S.viewed[p.id]=1; sb.rpc('track_page',{p_slug:p.slug,p_kind:'view'}).then(()=>{}); }
  const bar = owner ? `<div class="pub-bar">${p.published?'Você está vendo sua página publicada.':'Prévia: esta página está em rascunho.'} <a href="#editar-${p.id}">Editar página</a></div>`
            : p.demo ? `<div class="pub-bar">Página de exemplo · <a href="#login">Crie a sua</a></div>` : '';
  return bar + `<div id="pubwrap" style="min-height:100%">${renderPage(p,'view')}</div>`;
}

function addTime(from, n, unit){ const d=new Date(from); if(unit==='semanas') d.setDate(d.getDate()+7*n); else d.setMonth(d.getMonth()+n); return d; }
function daysLeft(until){ return Math.max(0, Math.ceil((new Date(until)-new Date())/86400000)); }
function planLabel(sub){ if(!sub) return 'Grátis'; if(sub.plan==='admin') return 'Acesso liberado'; return (PLANS[sub.plan]||{}).name || sub.plan; }
function accStatus(u){
  if(u.blocked) return ['blocked','Bloqueada'];
  if(!u.sub) return ['free','Sem acesso'];
  const d=daysLeft(u.sub.until);
  if(new Date(u.sub.until)<=new Date()) return ['expired','Vencida'];
  if(d<=7) return ['soon',`Vence em ${d} dia${d>1?'s':''}`];
  return ['active','Ativa'];
}

      ${reqs.map(r=>{ const c=byId[r.user_id]; const P=PLANS[r.plan]; const val = r.plan==='mensal'?brl(P.month): r.mode==='vista'?brl(total(r.plan))+' à vista':`${P.months}x ${brl(P.month)}`;
        return `<div class="req"><div style="min-width:0"><b>${esc(c?.name||'Conta removida')}</b><span class="acc-mail">${esc(c?.email||'')}</span><span class="req-d">Plano ${P.name} · ${val} · ${r.method==='pix'?'Pix':'Cartão'} · ${fmtDT(r.created_at)}${r.gateway==='asaas'?' · aguardando o Asaas (libera sozinho ao pagar)':''}</span></div>
          <div class="acts"><button class="btn btn-p btn-s" data-act="admreq" data-id="${r.id}" data-v="aprovado">Aprovar</button><button class="btn btn-g btn-s" data-act="admreq" data-id="${r.id}" data-v="recusado">Recusar</button></div></div>`; }).join('')}</section>`:''}
    <div class="adm-grid">
      <section class="adm-side"><section class="card adm-new"><h2 class="disp" style="font-size:22px;margin-bottom:14px">${RV?'Cadastrar cliente':'Cadastrar conta'}</h2>
        ${A.created?`<div class="cred"><div class="pill ok">Conta criada</div><p style="margin-top:10px">Envie estes dados para o cliente:</p><pre id="cred-txt">${esc(A.created)}</pre><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-p btn-s" data-act="admcopy">Copiar dados de acesso</button><button class="btn btn-g btn-s" data-act="admnew">Cadastrar outra</button></div></div>`:`
        <form class="form" id="f-admnew">
          ${RV?'':`<div class="field"><label>Tipo de conta</label><div class="seg"><button type="button" class="${A.role==='cliente'?'on':''}" data-act="admrole" data-v="cliente">Cliente</button><button type="button" class="${A.role==='revendedor'?'on':''}" data-act="admrole" data-v="revendedor">Revendedor</button></div></div>
          ${A.role==='revendedor'?`<div class="field"><label for="an-limit">Limite de clientes</label><input type="number" id="an-limit" min="1" max="10000" value="${A.limit}"><span class="hint">Quantos restaurantes este revendedor pode cadastrar.</span></div>`:
            resellers.length?`<div class="field"><label for="an-res">Revendedor responsável (opcional)</label><select id="an-res"><option value="">Nenhum (cliente direto)</option>${resellers.map(r=>`<option value="${r.id}" ${A.res===r.id?'selected':''}>${esc(r.name||r.email)}</option>`).join('')}</select></div>`:''}`}

          <div class="field"><label>Tempo de acesso</label>
            <div class="seg">${QUICK.map(([n,un,l])=>`<button type="button" class="${+A.n===n&&A.unit===un?'on':''}" data-act="admq" data-n="${n}" data-u="${un}">${l}</button>`).join('')}</div>
            <div class="dur"><input type="number" id="an-n" min="1" max="120" value="${A.n}" aria-label="Quantidade"><select id="an-unit" aria-label="Unidade"><option value="semanas" ${A.unit==='semanas'?'selected':''}>semanas</option><option value="meses" ${A.unit==='meses'?'selected':''}>meses</option></select></div>

      </section>
      ${RV&&RM?`<section class="card adm-new" style="margin-top:16px"><h2 class="disp" style="font-size:20px;margin-bottom:6px">Sua marca nas páginas</h2><p class="muted" style="font-size:14px;margin-bottom:12px">Aparece no rodapé das páginas dos seus clientes. Deixe em branco para não mostrar nada.</p>

        <div class="field"><label for="br-url">Link (opcional)</label><input type="text" id="br-url" maxlength="200" value="${esc(RM.brand_url||'')}" placeholder="Ex.: instagram.com/suaagencia"></div>
        <button class="btn btn-g btn-block" type="submit">Salvar marca</button></form></section>`:''}
      </section>
      <section class="adm-list">
        <div class="adm-tools"><input type="text" id="adm-q" placeholder="Buscar por nome ou e-mail" value="${esc(A.q)}" aria-label="Buscar">

        ${list.length?`<div class="accs">${list.map(x=>{ const [k,l]=accStatus(x); const self=x.id===db.session;

          return `<article class="acc"><div class="acc-hd"><div style="min-width:0"><b>${esc(x.name||'Sem nome')}${x.is_admin?' <span class="pill">Admin</span>':''}${x.role==='revendedor'?` <span class="pill ok">Revendedor · ${x.clients}/${x.client_limit} clientes</span>`:''}</b>${resN&&!RV?`<span class="acc-mail">Cliente de ${esc(resN)}</span>`:''}<span class="acc-mail">${esc(x.email)}</span></div><span class="st st-${k}">${l}</span></div>
            <div class="acc-kv"><div><span>Plano</span><b>${planLabel(x.sub)}</b></div><div><span>Acesso até</span><b>${x.sub?fmtD(x.sub.until):'—'}</b></div><div><span>Dias restantes</span><b>${x.sub&&!x.blocked?daysLeft(x.sub.until):0}</b></div><div><span>Páginas</span><b>${x.pages||0}</b></div></div>

            <div class="acts"><button class="btn btn-p btn-s" data-act="admtime" data-id="${x.id}">Adicionar tempo</button><button class="btn btn-g btn-s" data-act="admdate" data-id="${x.id}">Definir data</button><button class="btn btn-g btn-s" data-act="admpw" data-id="${x.id}">Nova senha</button>${!RV&&!self?`<button class="btn btn-g btn-s" data-act="admsetrole" data-id="${x.id}">${x.role==='revendedor'?'Revendedor':'Tornar revendedor'}</button>`:''}${self?'':`<button class="btn btn-g btn-s" data-act="admblock" data-id="${x.id}">${x.blocked?'Desbloquear':'Bloquear'}</button><button class="btn btn-d btn-s" data-act="admdel" data-id="${x.id}">Excluir</button>`}</div></article>`;}).join('')}</div>`
        :`<div class="card empty"><b>${users.length?'Nenhuma conta neste filtro.':RV?'Nenhum cliente cadastrado ainda.':'Nenhuma conta cadastrada ainda.'}</b><p class="muted">${users.length?'Troque o filtro ou a busca.':'Use o formulário para cadastrar o primeiro cliente.'}</p></div>`}
        ${msgs.length?`<details class="card msgs"><summary><b>Mensagens de contato</b> <span class="pill">${msgs.length}</span></summary>${msgs.map(m=>`<div class="msg"><b>${esc(m.name)}</b> <span class="acc-mail">${esc(m.email)} · ${esc(m.subject)} · ${fmtDT(m.created_at)}</span><p>${esc(m.message)}</p></div>`).join('')}</details>`:''}
      </section>
    </div></main>`;
}
function admModal(title, body, okAct, id){
  S.modal=`<div class="modal" data-act="closemodal"><div class="box" style="width:min(460px,100%)" data-stop><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 class="disp" style="font-size:22px">${title}</h2><button class="ib" data-act="closemodal" aria-label="Fechar">✕</button></div>
    <div class="form" style="margin-top:14px">${body}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"><button class="btn btn-g" data-act="closemodal">Voltar</button><button class="btn btn-p" data-act="${okAct}" data-id="${esc(id)}">Confirmar</button></div></div></div>`;
  $('#modal-root').innerHTML=S.modal;
}
function closeModal(){ S.modal=null; $('#modal-root').innerHTML=''; }
async function admCall(action, payload, okMsg){
  try{ const r=await api(action, payload); closeModal(); S.adm.data = await api('admin_list'); rerenderKeep(); if(okMsg) toast(typeof okMsg==='function'?okMsg(r):okMsg); return r; }
  catch(err){ toast(err.message); return null; }
}
function admAct(act, id, a){
  const u = S.adm.data ? toUser(S.adm.data.profiles.find(x=>x.id===id)) : null;
  switch(act){
    case 'admq': S.adm.n=+a.dataset.n; S.adm.unit=a.dataset.u; keepAdmForm(); return true;
    case 'admrole': S.adm.role=a.dataset.v; keepAdmForm(); return true;
    case 'admsetrole': admModal('Tipo de conta', `<p class="muted">${esc(u.name||u.email)}</p><div class="seg" id="sr-seg"><button type="button" class="${u.role!=='revendedor'?'on':''}" data-act="admsrv" data-v="cliente">Cliente</button><button type="button" class="${u.role==='revendedor'?'on':''}" data-act="admsrv" data-v="revendedor">Revendedor</button></div>
        <div class="field"><label for="sr-limit">Limite de clientes (para revendedor)</label><input type="number" id="sr-limit" min="0" max="10000" value="${u.client_limit||10}"></div><input type="hidden" id="sr-role" value="${u.role}"><span class="hint">Ao voltar para cliente, os clientes dele ficam sem revendedor (passam a ser seus).</span>`, 'admsetroleok', id); return true;
    case 'admsrv': $('#sr-role').value=a.dataset.v; a.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===a)); return true;
    case 'admsetroleok': admCall('admin_set_role',{id, role:$('#sr-role').value, limit:+$('#sr-limit').value||0}, 'Tipo de conta atualizado'); return true;
    case 'admgen': $('#an-pw').value=genPw(); return true;
    case 'admf': S.adm.f=a.dataset.v; rerenderKeep(); return true;
    case 'admnew': S.adm.created=null; S.adm.err=''; rerenderKeep(); return true;
    case 'admreload': S.adm.state=null; S.adm.data=null; render(); return true;
    case 'admclaim': api('claim_admin').then(()=>{ toast('Pronto, você é o administrador'); S.adm.state=null; render(); }).catch(err=>toast(err.message)); return true;
    case 'admcopy': { const t=$('#cred-txt').textContent; navigator.clipboard.writeText(t).then(()=>toast('Dados copiados'),()=>{ const r=document.createRange(); r.selectNodeContents($('#cred-txt')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selecione e copie o texto'); }); return true; }
    case 'admreq': admCall('admin_request',{id, status:a.dataset.v}, r=>a.dataset.v==='recusado'?'Pedido recusado':`Acesso liberado até ${fmtD(r.until)}`); return true;
    case 'admtime': admModal('Adicionar tempo', `<p class="muted">${esc(u.name||u.email)} · ${active(u)?'acesso até '+fmtD(u.sub.until):'sem acesso ativo'}</p>
        <div class="seg">${QUICK.map(([n,un,l])=>`<button type="button" data-act="admmq" data-n="${n}" data-u="${un}">${l}</button>`).join('')}</div>
        <div class="dur"><input type="number" id="mt-n" min="1" max="120" value="1" aria-label="Quantidade"><select id="mt-unit" aria-label="Unidade"><option value="semanas">semanas</option><option value="meses" selected>meses</option></select></div>
        <span class="hint">O tempo é somado ao acesso atual. Se a conta estiver vencida, conta a partir de hoje.</span>`, 'admtimeok', id); return true;
    case 'admmq': $('#mt-n').value=a.dataset.n; $('#mt-unit').value=a.dataset.u; a.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===a)); return true;
    case 'admtimeok': admCall('admin_add_time',{id, n:Math.max(1,+$('#mt-n').value||1), unit:$('#mt-unit').value}, r=>`Acesso liberado até ${fmtD(r.until)}`); return true;
    case 'admdate': { const cur = u.sub ? new Date(u.sub.until) : addTime(new Date(),1,'meses'); const v=cur.toISOString().slice(0,10);
      admModal('Definir data de vencimento', `<p class="muted">${esc(u.name||u.email)}</p><div class="field"><label for="md-date">Acesso até</label><input type="date" id="md-date" value="${v}"></div>`, 'admdateok', id); return true; }
    case 'admdateok': { const v=$('#md-date').value; if(!v){ toast('Escolha uma data'); return true; } admCall('admin_set_date',{id, date:v}, r=>`Vencimento definido para ${fmtD(r.until)}`); return true; }
    case 'admpw': admModal('Definir nova senha', `<p class="muted">${esc(u.name||u.email)}</p><div class="field"><label for="mp-pw">Nova senha</label><div class="copyrow"><input type="text" id="mp-pw" value="${genPw()}"><button type="button" class="btn btn-g btn-s" data-act="admgen2">Gerar</button></div><span class="hint">Copie e envie para o cliente antes de confirmar.</span></div>`, 'admpwok', id); return true;
    case 'admgen2': $('#mp-pw').value=genPw(); return true;
    case 'admpwok': { const pw=$('#mp-pw').value; if(pw.length<8){ toast('A senha precisa ter pelo menos 8 caracteres'); return true; } admCall('admin_set_password',{id, password:pw}, 'Senha alterada'); return true; }
    case 'admblock': admCall('admin_block',{id, blocked:!u.blocked}, u.blocked?'Conta desbloqueada':'Conta bloqueada'); return true;
    case 'admdel': S.modal=confirmModal(`Excluir a conta de ${esc(u.name||u.email)} e todas as páginas dela?`,'admdelok',id); $('#modal-root').innerHTML=S.modal; return true;
    case 'admdelok': admCall('admin_delete',{id}, 'Conta excluída'); return true;
  }
  return false;
}
function keepAdmForm(){ const keep={}; ['an-nome','an-email','an-pw','an-obs','an-limit'].forEach(k=>{ const el=$('#'+k); if(el) keep[k]=el.value; }); rerenderKeep(); Object.entries(keep).forEach(([k,v])=>{ const el=$('#'+k); if(el) el.value=v; }); }
async function admSubmit(form){
  if(form.id==='f-admbrand'){
    const brand_name=$('#br-name').value.trim(), brand_url=$('#br-url').value.trim();
    const { error } = await sb.from('profiles').update({ brand_name, brand_url }).eq('id', db.session);
    if(error){ toast('Não foi possível salvar a marca.'); return; }
    if(S.adm.data?.me) Object.assign(S.adm.data.me,{brand_name,brand_url}); try{ db.brand=(await sb.rpc('page_brand',{p_owner:db.session})).data; db.pages.forEach(p=>p._brand=db.brand); }catch(e){}
    toast('Marca salva'); return;
  }
  if(form.id!=='f-admnew' || S.busy) return;
  const name=$('#an-nome').value.trim(), em=$('#an-email').value.trim().toLowerCase(), pw=$('#an-pw').value, n=Math.max(1,+$('#an-n').value||1), un=$('#an-unit').value, note=$('#an-obs').value.trim();
  const extra = admMode()==='revenda' ? {} : { role:S.adm.role, limit:+($('#an-limit')?.value||0), reseller_id:$('#an-res')?.value||'' };
  if(extra.role==='revendedor') S.adm.limit=extra.limit; if($('#an-res')) S.adm.res=$('#an-res').value;
  S.busy=true; S.adm.err=''; keepAdmForm();
  try{
    const r = await api('admin_create',{name,email:em,password:pw,n,unit:un,note,...extra});
    S.adm.created=`Cardápio NFC\nSite: ${location.href.split('#')[0]}#login\nE-mail: ${em}\nSenha: ${pw}\nAcesso até: ${fmtD(r.until)}`;
    S.adm.data = await api('admin_list'); S.busy=false; rerenderKeep(); toast('Conta cadastrada');
  }catch(err){ S.busy=false; S.adm.err=err.message; keepAdmForm(); }
}

let curRoute='';
function render(){
  const h=(location.hash||'#inicio').slice(1)||'inicio';
  if(!db.ready && (['login','assinar','painel','dashboard','admin','revenda'].includes(h) || h.startsWith('editar-'))){ $('#app').innerHTML=`<main class="wrap" style="padding-block:120px;text-align:center"><p class="muted">Carregando…</p></main>`; return; }
  const app=$('#app'); let html='', after=null;
  if(h==='inicio'||h==='como-funciona'||h==='planos'||h==='identidade') html=viewHome();
  else if(h==='sobre') html=viewSobre();
  else if(h==='contato') html=viewContato();
  else if(h==='privacidade') html=viewPriv();
  else if(h==='login') html=viewLogin();
  else if(h==='assinar') html=viewAssinar();
  else if(h==='painel'||h==='dashboard') html=viewPainel();
  else if(h==='admin'||h==='revenda') html=viewAdmin();
  else if(h.startsWith('editar-')){ html=viewEditor(h.slice(7)); after=()=>{ const p=getPage(h.slice(7)); if(p&&S.edTab==='publicar') drawQR(p); }; }
  else if(h.startsWith('p-')) html=viewPublic(h.slice(2));
  else html=viewHome();
  if(html==='') return;
  app.innerHTML=html;
  $('#modal-root').innerHTML = S.modal ? S.modal : '';
  if(after) after();
  const scrollTo = ['como-funciona','planos','identidade'].includes(h) ? document.getElementById(h) : null;
  if(h!==curRoute){ if(scrollTo) scrollTo.scrollIntoView({behavior:'smooth'}); else window.scrollTo(0,0); }
  curRoute=h;
}
window.addEventListener('hashchange',()=>{ if(dirty.size) flush(); if(location.hash==='#admin'||location.hash==='#revenda'){ S.adm.state=null; S.adm.data=null; S.adm.created=null; S.adm.err=''; } S.menu=false; S.modal=null; S.authErr=''; S.coErr=''; if(!location.hash.startsWith('#assinar')) S.coDone=false; render(); });

/* re-render só do que muda */
function curPage(){ const h=location.hash.slice(1); if(h.startsWith('editar-')) return getPage(h.slice(7)); if(h.startsWith('p-')){ const s=h.slice(2).split('/')[0]; return db.pages.find(x=>x.slug===s)||DEMOS.find(x=>x.slug===s)||S.pub[s]||null;} return null; }
function refreshPreview(){
  const p=curPage(); if(!p) return;
  const prev=$('#prev'); if(prev){ const st=prev.scrollTop; prev.innerHTML=renderPage(p,'edit'); prev.scrollTop=st; return; }
  const pw=$('#pubwrap'); if(pw) pw.innerHTML=renderPage(p,'view');
}
function refreshSide(){ const p=curPage(); const s=$('#ed-side'); if(!p||!s) return; const st=s.scrollTop; s.innerHTML=edSide(p); s.scrollTop=st; if(S.edTab==='publicar') drawQR(p); }
