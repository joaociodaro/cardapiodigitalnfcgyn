document.addEventListener('click', async e=>{
  const stop=e.target.closest('[data-stop]'); const a=e.target.closest('[data-act]');
  if(!a) return;
  if(stop && a.dataset.act==='closemodal' && !a.closest('button')) return;
  const act=a.dataset.act, id=a.dataset.id, v=a.dataset.v;
  if(a.tagName==='INPUT' && a.type==='checkbox' && !['publish','ownc','itoff','mdat','ordt','wafloat','agday'].includes(act)) return;
  if(act.startsWith('adm') && admAct(act, id, a)) return;
  const p=curPage();
  switch(act){
    case 'menu': S.menu=!S.menu; rerenderKeep(); break;
    case 'closemodal': if(e.target.closest('.box') && !e.target.closest('button[data-act="closemodal"]')) return; S.modal=null; $('#modal-root').innerHTML=''; break;
    case 'idlook': S.idT={...S.idT, look:v, ...pick(LOOKS[v])}; rerenderKeep(); break;
    case 'idset': S.idT={...S.idT,[a.dataset.f]:v}; rerenderKeep(); break;
    case 'buy': S.co.plan=a.dataset.plan; S.co.mode='vista'; S.coDone=false; if(location.hash==='#assinar') render(); else location.hash='assinar'; break;
    case 'authtab': S.authTab=v; S.authErr=''; render(); break;
    case 'co': S.co[a.dataset.f]=v; if(a.dataset.f==='plan'&&v==='mensal') S.co.mode='vista'; S.coErr=''; rerenderKeep(); break;
    case 'pay': await doPay(); break;
    case 'logout': if(dirty.size) await flush(); await sb.auth.signOut(); db.session=null; db.users={}; db.pages=[]; db.pending=[]; S.adm.data=null; S.adm.state=null; S.authTab='entrar'; location.hash='inicio'; break;
    case 'new': if(!active(me()) && !freeAvailable()){ openPaywall(); break; } S.modal=tplModal(); $('#modal-root').innerHTML=S.modal; break;
    case 'paywall': openPaywall(); break;
    case 'tpl': await createPage(v); break;
    case 'dup': { if(!active(me())){ openPaywall('Duplicar páginas faz parte dos planos.'); break; } const o=getPage(id); const c=JSON.parse(JSON.stringify(o)); c.name=o.name+' (cópia)'; c.published=false; c.mods.forEach(m=>m.id=uid()); const r=await insertPage(c, o.slug+'-copia'); if(r){ db.pages.push(r); render(); toast('Página duplicada'); } break; }
    case 'del': S.modal=confirmModal('Excluir esta página?','delok',id); $('#modal-root').innerHTML=S.modal; break;
    case 'delok': { const { error } = await sb.from('pages').delete().eq('id',id); if(error){ toast('Não foi possível excluir. Tente de novo.'); break; } dirty.delete(id); db.pages=db.pages.filter(x=>x.id!==id); S.modal=null; render(); toast('Página excluída'); break; }
    case 'etab': S.edTab=v; refreshSide(); break;
    case 'mob': S.mobPrev=v==='1'; render(); break;
    case 'desk': S.desk=v==='1'; render(); break;
    case 'toggle': if(e.target.closest('.ib')) return; S.openMod = S.openMod===id?null:id; refreshSide(); break;
    case 'up': case 'down': { e.stopPropagation(); const i=p.mods.findIndex(m=>m.id===id), j=act==='up'?i-1:i+1; if(j<0||j>=p.mods.length) return; [p.mods[i],p.mods[j]]=[p.mods[j],p.mods[i]]; commit(true); break; }
    case 'rm': e.stopPropagation(); p.mods=p.mods.filter(m=>m.id!==id); commit(true); toast('Módulo removido'); break;
    case 'add': { const m=mkMod(v); p.mods.push(m); S.openMod=m.id; commit(true); toast(`${MODS[v].label} adicionado`); break; }
    case 'mset': { const m=p.mods.find(x=>x.id===id); m[a.dataset.f]= a.dataset.f==='v'?+v:v; commit(true); break; }
    case 'ownc': { const m=p.mods.find(x=>x.id===id); m.accent = a.checked ? '#0B63CE' : ''; commit(true); break; }
    case 'look': Object.assign(p.theme,{look:v,...pick(LOOKS[v])}); commit(true); break;
    case 'set': p.theme[a.dataset.f]=v; commit(true); break;
    case 'publish': p.published=!p.published; save(); await flush(); render(); toast(p.published?'Página publicada':'Página voltou para rascunho'); break;
    case 'copy': { const inp=$('#share-url'); try{ await navigator.clipboard.writeText(inp.value); toast('Link copiado'); }catch(err){ inp.select(); toast('Selecione e copie o link'); } break; }
    case 'rmimg': { const m=p.mods.find(x=>x.id===id); m.data[a.dataset.f]=''; commit(true); break; }
    case 'wafloat': { p.theme.waFloat=!p.theme.waFloat; commit(true); break; }
    case 'mdat': { const m=p.mods.find(x=>x.id===id); const f=a.dataset.f; if(v==='!'){ const defOn=['nav','map','askName'].includes(f); const cur = m.data[f]===undefined ? defOn : m.data[f]!==false && !!m.data[f]; m.data[f]=!cur; } else m.data[f]=v; commit(true); break; }
    case 'ordt': { const m=p.mods.find(x=>x.id===id); const o=m.data.order=m.data.order||defOrder(); const f=a.dataset.f; if(f.startsWith('pay.')){ o.pay=o.pay||{}; o.pay[f.slice(4)]=!o.pay[f.slice(4)]; } else if(f==='askName') o.askName = o.askName===false; else o[f]=!o[f]; commit(true); break; }
    case 'agday': { const m=p.mods.find(x=>x.id===id); agWeek(m.data); m.data.days[+a.dataset.i]=!m.data.days[+a.dataset.i]; commit(true); break; }
    case 'agcopy': { const m=p.mods.find(x=>x.id===id); const wh=agWeek(m.data); for(let i=0;i<7;i++) if(i!==1) wh[i]={...wh[1]}; commit(true); toast('Horário copiado para todos os dias'); break; }
    case 'agmo': { S.agMo={...(S.agMo||{}),[id]:+v}; refreshSide(); break; }
    case 'agsel': { S.agSel={...(S.agSel||{}),[id]:S.agSel&&S.agSel[id]===v?'':v}; if(v){ const dt=new Date(v+'T12:00:00'), now=new Date(); S.agMo={...(S.agMo||{}),[id]:Math.max(0,(dt.getFullYear()-now.getFullYear())*12+dt.getMonth()-now.getMonth())}; } refreshSide(); break; }
    case 'agmode': { const m=p.mods.find(x=>x.id===id); const ex=agExc(m.data), k=S.agSel&&S.agSel[id]; if(!k) break; const cur=ex[k]||{};
      if(!v){ if(cur.off&&cur.off.length) ex[k]={off:cur.off}; else delete ex[k]; }
      else if(v==='fechado') ex[k]={mode:'fechado'};
      else { const w=agWeek(m.data)[new Date(k+'T12:00:00').getDay()]; ex[k]={mode:'especial', start:cur.start||w.start||'09:00', end:cur.end||w.end||'18:00', off:cur.off||[]}; }
      commit(true); break; }
    case 'agslot': { const m=p.mods.find(x=>x.id===id); const ex=agExc(m.data), k=S.agSel&&S.agSel[id]; if(!k) break; const e=ex[k]||(ex[k]={}); const off=new Set(e.off||[]); off.has(v)?off.delete(v):off.add(v); e.off=[...off].sort(); if(!e.mode&&!e.off.length) delete ex[k]; commit(true); break; }
    case 'agexrm': { const m=p.mods.find(x=>x.id===id); delete agExc(m.data)[v]; commit(true); toast('Data voltou ao horário padrão'); break; }
    case 'mhide': { e.stopPropagation(); const m=p.mods.find(x=>x.id===id); m.hidden=!m.hidden; commit(true); toast(m.hidden?'Módulo oculto da página':'Módulo visível'); break; }
    case 'mdup': { e.stopPropagation(); const i=p.mods.findIndex(x=>x.id===id); const c=JSON.parse(JSON.stringify(p.mods[i])); c.id=uid(); p.mods.splice(i+1,0,c); S.openMod=c.id; commit(true); toast('Módulo duplicado'); break; }
    case 'rmbgimg': p.theme.bgImage=''; commit(true); break;
    case 'copymesa': { const inp=$('#mesa-url'); try{ await navigator.clipboard.writeText(inp.value); toast('Link da mesa copiado'); }catch(err){ inp.select(); toast('Selecione e copie o link'); } break; }
    case 'icopen': S.icOpen = S.icOpen===a.dataset.i ? null : a.dataset.i; refreshSide(); break;
    case 'icset': { const m=p.mods.find(x=>x.id===id); const l=linkItems(m.data).find(x=>x.id===a.dataset.i); l.icon=v||''; S.icOpen=null; commit(true); break; }
    case 'lnkadd': { const m=p.mods.find(x=>x.id===id); const l=mkLink(); linkItems(m.data).push(l); commit(true); focusLater(`[data-f="lnk:${id}:${l.id}:name"]`); break; }
    case 'lnkrm': { const m=p.mods.find(x=>x.id===id); m.data.links=linkItems(m.data).filter(x=>x.id!==a.dataset.i); commit(true); toast('Link excluído'); break; }
    case 'lnkmv': { const m=p.mods.find(x=>x.id===id); const L=linkItems(m.data); const i=L.findIndex(x=>x.id===a.dataset.i), j=i+ +a.dataset.d; if(j<0||j>=L.length) break; [L[i],L[j]]=[L[j],L[i]]; commit(true); break; }
    case 'secadd': { const m=p.mods.find(x=>x.id===id); const sc=mkSec('Nova categoria',[['','','']]); menuSecs(m.data).push(sc); commit(true); focusLater(`[data-f="cat:${id}:${sc.id}:title"]`,true); break; }
    case 'secrm': { const m=p.mods.find(x=>x.id===id); const secs=menuSecs(m.data); const sc=secs.find(x=>x.id===a.dataset.s); if(sc.items.length){ S.modal=confirmModal(`Excluir a categoria "${esc(sc.title||'sem nome')}" e seus ${sc.items.length} itens?`,'secrmok',id+'|'+sc.id); $('#modal-root').innerHTML=S.modal; } else { m.data.sections=secs.filter(x=>x.id!==sc.id); commit(true); } break; }
    case 'secrmok': { const [mid,sid]=id.split('|'); const m=p.mods.find(x=>x.id===mid); m.data.sections=m.data.sections.filter(x=>x.id!==sid); S.modal=null; $('#modal-root').innerHTML=''; commit(true); toast('Categoria excluída'); break; }
    case 'secmv': { const m=p.mods.find(x=>x.id===id); const L=menuSecs(m.data); const i=L.findIndex(x=>x.id===a.dataset.s), j=i+ +a.dataset.d; if(j<0||j>=L.length) break; [L[i],L[j]]=[L[j],L[i]]; commit(true); break; }
    case 'svcadd': { const m=p.mods.find(x=>x.id===id); agSvcs(m.data); const it=mkSvc(); m.data.svcs.push(it); commit(true); focusLater(`[data-f="svc:${id}:${it.id}:name"]`); break; }
    case 'svcrm': { const m=p.mods.find(x=>x.id===id); agSvcs(m.data); m.data.svcs=m.data.svcs.filter(x=>x.id!==a.dataset.i); commit(true); toast('Serviço excluído'); break; }
    case 'svcmv': { const m=p.mods.find(x=>x.id===id); const L=agSvcs(m.data)&&m.data.svcs; const i=L.findIndex(x=>x.id===a.dataset.i), j=i+ +a.dataset.d; if(j<0||j>=L.length) break; [L[i],L[j]]=[L[j],L[i]]; commit(true); break; }
    case 'svcph': { const m=p.mods.find(x=>x.id===id); const it=agSvcs(m.data).find(x=>x.id===a.dataset.i); if(it) it.photo=''; commit(true); break; }
    case 'itadd': { const m=p.mods.find(x=>x.id===id); const sc=menuSecs(m.data).find(x=>x.id===a.dataset.s); const it=mkItem(); sc.items.push(it); commit(true); focusLater(`[data-f="itm:${id}:${sc.id}:${it.id}:name"]`); break; }
    case 'itrm': { const m=p.mods.find(x=>x.id===id); const sc=menuSecs(m.data).find(x=>x.id===a.dataset.s); sc.items=sc.items.filter(x=>x.id!==a.dataset.i); commit(true); toast('Item excluído'); break; }
    case 'itmv': { const m=p.mods.find(x=>x.id===id); const L=menuSecs(m.data).find(x=>x.id===a.dataset.s).items; const i=L.findIndex(x=>x.id===a.dataset.i), j=i+ +a.dataset.d; if(j<0||j>=L.length) break; [L[i],L[j]]=[L[j],L[i]]; commit(true); break; }
    case 'itph': { const m=p.mods.find(x=>x.id===id); const it=menuSecs(m.data).find(x=>x.id===a.dataset.s).items.find(x=>x.id===a.dataset.i); it.photo=''; commit(true); break; }
    case 'itoff': { const m=p.mods.find(x=>x.id===id); const it=menuSecs(m.data).find(x=>x.id===a.dataset.s).items.find(x=>x.id===a.dataset.i); it.off=a.checked; commit(false); break; }
    case 'rmitem': { const m=p.mods.find(x=>x.id===id); if(m.data.photos) delete m.data.photos[a.dataset.i]; commit(true); break; }
    case 'rmgal': { const m=p.mods.find(x=>x.id===id); m.data.images.splice(+a.dataset.i,1); commit(true); break; }
    case 'ckset': { const k=a.dataset.k; S.ck[k]={...(S.ck[k]||{}),[a.dataset.f]:v}; refreshAnyPage(a); break; }
    case 'ckgo': { const t=document.getElementById(a.dataset.t); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); break; }
    case 'mjump': { const t=document.getElementById(a.dataset.t); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); break; }
    case 'copyaddr': { try{ await navigator.clipboard.writeText(v); toast('Endereço copiado'); }catch(err){ toast(v); } break; }
    case 'cart': { e.preventDefault(); const k=a.dataset.k, i=a.dataset.i; S.cart[k]=S.cart[k]||{}; S.cart[k][i]=Math.max(0,(S.cart[k][i]||0)+ +a.dataset.d); refreshAnyPage(a); break; }
    case 'svbook': { const k=a.dataset.k; S.sched[k]={...(S.sched[k]||{}),s:v}; refreshAnyPage(a); const mid=k.split(':').pop(); setTimeout(()=>{ const el=document.querySelector(`.pg [data-mid="${mid}"]`); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },60); break; }
    case 'sched': { const k=a.dataset.k; S.sched[k]={...(S.sched[k]||{}),[a.dataset.f]:v}; refreshAnyPage(a); break; }
  }
});

document.addEventListener('change', e=>{
  if(e.target.id==='an-unit'){ e.target.dispatchEvent(new Event('input',{bubbles:true})); return; }
  const s=e.target.closest('[data-act="sched-s"]'); if(s){ S.sched[s.dataset.k]={...(S.sched[s.dataset.k]||{}),s:s.value}; refreshAnyPage(s); return; }
  const up=e.target.closest('[data-up]'); if(up) handleUpload(up);
  const ag=e.target.closest('[data-f^="exc:"],[data-f^="wh:"],[data-f*=":interval"],[data-f*=":lunch"]'); if(ag && typeof refreshSide==='function') setTimeout(refreshSide,0);
});
document.addEventListener('input', e=>{
  const ckel=e.target.closest('[data-ck]');
  if(ckel){ const cks=ckel.dataset.ck, ci=cks.lastIndexOf(':'), k=cks.slice(0,ci), f=cks.slice(ci+1); S.ck[k]={...(S.ck[k]||{}),[f]:ckel.value}; const pg=ckel.closest('.pg'); const pp=[...DEMOS,...MINIS,...db.pages,...Object.values(S.pub||{}).filter(Boolean)].find(x=>x.id===pg.dataset.pid); const mm=pp&&pp.mods.find(x=>x.id===k.split(':').pop()); const box=pg.querySelector(`[data-cksend="${k}"]`); if(pp&&mm&&box) box.outerHTML=ckSend(orderCalc(pp,mm,k),k); return; }
  const schel=e.target.closest('[data-sch]');
  if(schel){ const parts=schel.dataset.sch.split(':'); const f=parts.pop(), k=parts.join(':'); S.sched[k]={...(S.sched[k]||{}),[f]:schel.value}; const pg=schel.closest('.pg'); const box=pg.querySelector(`[data-schsend="${k}"]`); if(box){ const pp=[...DEMOS,...MINIS,...db.pages,...Object.values(S.pub||{}).filter(Boolean)].find(x=>x.id===pg.dataset.pid); if(pp){ const html=renderPage(pp,pg.dataset.ctx); const tmp=document.createElement('div'); tmp.innerHTML=html; const nb=tmp.querySelector(`[data-schsend="${k}"]`); if(nb) box.outerHTML=nb.outerHTML; } } return; }
  const se=e.target.closest('[data-mnsearch]');
  if(se){ const q=se.value.trim().toLowerCase(); const mod=se.closest('.pm'); mod.querySelectorAll('.mn-i').forEach(x=>x.hidden = !!q && !x.dataset.name.includes(q)); mod.querySelectorAll('.msec').forEach(sc=>sc.hidden = !!q && !sc.querySelector('.mn-i:not([hidden])')); return; }
  if(e.target.id==='mesa-n'){ const pp=curPage(); if(pp) drawMesaQR(pp); return; }
  if(e.target.id==='adm-q'){ S.adm.q=e.target.value; const pos=e.target.selectionStart; keepAdmForm(); const q=$('#adm-q'); if(q){ q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){} } return; }
  if(e.target.id==='an-n'||e.target.id==='an-unit'){ S.adm.n=+$('#an-n').value||1; S.adm.unit=$('#an-unit').value; const h=$('#an-until'); if(h) h.innerHTML=`Acesso até <b>${fmtD(addTime(new Date(),S.adm.n,S.adm.unit))}</b>`; document.querySelectorAll('[data-act="admq"]').forEach(b=>b.classList.toggle('on', +b.dataset.n===S.adm.n && b.dataset.u===S.adm.unit)); return; }
  const el=e.target.closest('[data-f]'); if(!el||!el.dataset.f.includes(':')) return;
  const p=curPage(); if(!p) return;
  const [scope,a,b]=el.dataset.f.split(':');
  if(scope==='theme'){ p.theme[a]= (a==='radius'||a==='bgInt') ? +el.value : el.value; if(a==='radius'&&$('#rv')) $('#rv').textContent=el.value+'px'; if(a==='bgInt'&&$('#iv')) $('#iv').textContent=el.value+'%'; if(['bg','card','text','accent'].includes(a)) p.theme.look=''; }
  else if(scope==='ord'){ const m=p.mods.find(x=>x.id===a); m.data.order=m.data.order||defOrder(); m.data.order[b]=el.value; }
  else if(scope==='lnk'){ const parts=el.dataset.f.split(':'); const m=p.mods.find(x=>x.id===parts[1]); const l=linkItems(m.data).find(x=>x.id===parts[2]); l[parts[3]]=el.value; }
  else if(scope==='cat'||scope==='itm'){ const parts=el.dataset.f.split(':'); const m=p.mods.find(x=>x.id===parts[1]); const sc=menuSecs(m.data).find(x=>x.id===parts[2]);
    if(scope==='cat') sc.title=el.value; else { const it=sc.items.find(x=>x.id===parts[3]); it[parts[4]]=el.value; if(parts[4]==='name'){ const t=el.closest('.mit-ed')?.querySelector('.iph-t'); if(t&&!it.photo) t.style.backgroundImage=`url('${illUrl(illFor(it.name,'prato'))}')`; } } }
  else if(scope==='wh'){ const parts=el.dataset.f.split(':'); const m=p.mods.find(x=>x.id===parts[1]); agWeek(m.data)[+parts[2]][parts[3]]=el.value; }
  else if(scope==='exc'){ const parts=el.dataset.f.split(':'); const m=p.mods.find(x=>x.id===parts[1]); const e=agExc(m.data)[parts[2]]; if(e) e[parts[3]]=el.value; }
  else if(scope==='svc'){ const parts=el.dataset.f.split(':'); const m=p.mods.find(x=>x.id===parts[1]); const it=agSvcs(m.data).find(x=>x.id===parts[2]); if(it) it[parts[3]]=el.value; }
  else if(scope==='mod'){ const m=p.mods.find(x=>x.id===a); if(b==='@accent') m.accent=el.value; else m.data[b]=el.value; }
  else if(scope==='page'){
    if(a==='slug'){ const s=slugify(el.value); const taken=db.pages.some(x=>x.slug===s&&x.id!==p.id)||DEMOS.some(x=>x.slug===s); const hint=$('#slug-hint');
      if(taken){ hint.textContent='Esse endereço já está em uso.'; hint.style.color='var(--warn)'; return; } hint.textContent='Só letras, números e hífen.'; hint.style.color=''; p.slug=s; const ev=$('#ed-view'); if(ev) ev.href='#p-'+s; const su=$('#share-url'); if(su) su.value=pubUrl(p); drawQR(p); }
    else { p[a]=el.value; if(a==='name'&&$('#ed-name')) $('#ed-name').textContent=el.value; }
  }
  save(); refreshPreview();
});
document.addEventListener('submit', async e=>{
  e.preventDefault();
  if(e.target.id && e.target.id.startsWith('f-adm')){ await admSubmit(e.target); return; }
  if(e.target.id==='f-auth'){
    if(S.busy) return;
    const email=$('#a-email').value.trim().toLowerCase(), pw=$('#a-senha').value, name=S.authTab==='criar'?$('#a-nome').value.trim():'';
    S.busy=true; S.authErr=''; render();
    try{
      if(S.authTab==='criar') await api('signup',{name,email,password:pw});
      const { error } = await sb.auth.signInWithPassword({ email, password:pw });
      if(error) throw new Error(/banned/i.test(error.message)?'Esta conta está bloqueada. Fale com o suporte.':/invalid/i.test(error.message)?'E-mail ou senha incorretos. Confira e tente de novo.':'Não foi possível entrar agora. Tente de novo.');
      await loadSession();
      const u=me(); if(u && u.blocked){ await sb.auth.signOut(); db.session=null; throw new Error('Esta conta está bloqueada. Fale com o suporte.'); }
      S.busy=false; location.hash = S.after || 'painel'; S.after=null; if(S.authTab==='criar') toast('Conta criada'); render();
    }catch(err){ S.busy=false; S.authErr=err.message; render(); const ae=$('#a-email'); if(ae) ae.value=email; const an=$('#a-nome'); if(an) an.value=name; }
  }
  if(e.target.id==='f-contato'){
    const row={ name:$('#c-nome').value.trim(), email:$('#c-email').value.trim(), subject:$('#c-assunto').value, message:$('#c-msg').value.trim() };
    const { error } = await sb.from('contact_messages').insert(row);
    if(error){ toast('Não foi possível enviar. Tente de novo.'); return; }
    e.target.reset(); toast('Mensagem enviada. Respondemos por e-mail.');
  }
});

function focusLater(sel,select){ setTimeout(()=>{ const el=document.querySelector(sel); if(el){ el.focus(); if(select&&el.select) el.select(); el.scrollIntoView({block:'center',behavior:'smooth'}); } },30); }
function rerenderKeep(){ const y=window.scrollY; render(); window.scrollTo(0,y); }
function commit(side){ save(); refreshPreview(); if(side) refreshSide(); }
function refreshAnyPage(el){
  const pg=el.closest('.pg'); if(!pg) return;
  const pid=pg.dataset.pid, ctx=pg.dataset.ctx;
  const p=[...DEMOS,...MINIS,...db.pages,...Object.values(S.pub).filter(Boolean)].find(x=>x.id===pid);
  if(p){ pg.outerHTML=renderPage(p,ctx); }
  else { rerenderKeep(); }
}
async function insertPage(p, base){
  let slug=slugify(base||p.name);
  for(let i=0;i<6;i++){
    const cand = i===0 ? slug : `${slug}-${Math.random().toString(36).slice(2,6)}`;
    const { data, error } = await sb.from('pages').insert({ slug:cand, name:p.name, published:false, whatsapp:p.whatsapp||'', theme:p.theme, mods:p.mods }).select().single();
    if(!error) return fromRow(data);
    if(error.code!=='23505'){ if(/row-level security/i.test(error.message)){ openPaywall('Seu acesso não está ativo.'); return null; } toast('Não foi possível criar a página. Tente de novo.'); return null; }
  }
  toast('Não foi possível criar a página. Tente outro nome.'); return null;
}
async function createPage(k){
  const t=TEMPLATES[k], u=me(); const isFree=!active(u); if(isFree && !freeAvailable()){ openPaywall(); return; }
  const name = k==='branco'?'Minha página':t.name==='Página de links'?u.name:'Meu '+t.name.toLowerCase();
  const draft={ name, whatsapp:'', theme:defTheme(t.look), mods:t.mods.map(m=>mkMod(m, m==='capa'?{title:name, ill:t.ill||'mesa'}:{})) };
  S.modal=`<div class="modal"><div class="box" style="width:min(360px,100%);text-align:center"><p class="muted">Criando sua página…</p></div></div>`; $('#modal-root').innerHTML=S.modal;
  let page=null;
  if(isFree){
    try{ const r=await api('create_free_page',{ name, slug:slugify(name), theme:draft.theme, mods:draft.mods }); page=fromRow(r.page); u.free_used=true; }
    catch(err){ closeModal(); if(['free_used','free_used_ip'].includes(err.code)){ u.free_used=true; render(); openPaywall(err.message.replace(/ Assine.*$/,'')); } else toast(err.message); return; }
  } else page = await insertPage(draft, name);
  closeModal(); if(!page) return;
  db.pages.push(page); S.edTab='conteudo'; S.openMod=page.mods[0].id; location.hash='editar-'+page.id;
}
let payWatch=null;
function watchPayment(){
  if(payWatch) return; let n=0;
  payWatch=setInterval(async()=>{
    n++; if(n>90 || !db.session){ clearInterval(payWatch); payWatch=null; return; }
    try{ await loadSession(); }catch(e){ return; }
    const u=me();
    if(u && active(u)){ clearInterval(payWatch); payWatch=null; toast('Pagamento aprovado! Seu acesso foi liberado.'); if(location.hash==='#painel') render(); }
    else if(!db.pending.length){ clearInterval(payWatch); payWatch=null; if(location.hash==='#painel') render(); }
  }, 8000);
}
async function doPay(){
  if(S.busy) return;
  const c=S.co; S.coErr='';
  const n=$('#co-nome')?.value.trim(), em=$('#co-email')?.value.trim().toLowerCase(), pw=$('#co-senha')?.value||'', cpf=($('#co-cpf')?.value||'').trim();
  S.busy=true; rerenderKeep();
  const refill=()=>{ if($('#co-nome')){ $('#co-nome').value=n||''; $('#co-email').value=em||''; $('#co-senha').value=pw; } if($('#co-cpf')) $('#co-cpf').value=cpf; };
  refill();
  try{
    if(!me()){
      if(!n||!em||pw.length<8) throw new Error('Preencha nome, e-mail e uma senha com pelo menos 8 caracteres.');
      await api('signup',{name:n,email:em,password:pw});
      const { error } = await sb.auth.signInWithPassword({ email:em, password:pw }); if(error) throw new Error('Conta criada, mas não foi possível entrar. Entre pela tela de login.');
      await loadSession();
    }
    const digits = cpf.replace(/\D/g,'');
    if(digits.length!==11 && digits.length!==14) throw new Error('Informe um CPF (11 números) ou CNPJ (14 números) válido.');
    const mode = c.plan==='mensal'?'vista':c.mode;
    const r = await api('checkout',{ plan:c.plan, mode, method:mode==='parcelado'?'cartao':c.method, cpf:digits });
    try{ await loadSession(); }catch(e){}
    S.coLink = r.url; S.busy=false; S.coDone=true; render(); window.scrollTo(0,0);
    try{ sessionStorage.setItem('cnfc-pay','1'); }catch(e){}
    setTimeout(()=>{ location.href = r.url; }, 900);
  }catch(err){ S.busy=false; S.coErr=err.message; rerenderKeep(); refill(); }
}
const MAXW=1100;
function handleUpload(inp){
  const [kind,mid,key,key2]=inp.dataset.up.split(':'); const p=curPage(); const m=p.mods.find(x=>x.id===mid);
  const files=[...inp.files].slice(0,12); if(!files.length) return;
  toast(files.length>1?'Enviando fotos…':'Enviando foto…');
  Promise.all(files.map(f=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,MAXW/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); cv.toBlob(b=>res(b),'image/jpeg',.82); }; img.onerror=()=>res(null); img.src=r.result; }; r.readAsDataURL(f); })))
  .then(async blobs=>{
    const urls=[];
    for(const b of blobs.filter(Boolean)){
      const path=`${db.session}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const { error } = await sb.storage.from('media').upload(path, b, { contentType:'image/jpeg', cacheControl:'31536000' });
      if(!error) urls.push(sb.storage.from('media').getPublicUrl(path).data.publicUrl);
    }
    if(!urls.length){ toast('Não foi possível enviar a foto. Use JPG ou PNG de até 3 MB.'); return; }
    if(kind==='bgimg'){ p.theme.bgImage=urls[0]; }
    else if(kind==='lnk'){ const l=linkItems(m.data).find(x=>x.id===key); l.icon=urls[0]; S.icOpen=null; }
    else if(kind==='mitem'){ const it=menuSecs(m.data).find(x=>x.id===key).items.find(x=>x.id===key2); it.photo=urls[0]; }
    else if(kind==='svc'){ const it=agSvcs(m.data).find(x=>x.id===key); if(it) it.photo=urls[0]; }
    else if(kind==='item'){ m.data.photos={...(m.data.photos||{}),[key]:urls[0]}; }
    else if(kind==='img') m.data[key]=urls[0]; else m.data[key]=[...(m.data[key]||[]),...urls];
    save(); refreshPreview(); refreshSide(); toast(urls.length>1?`${urls.length} fotos adicionadas`:'Foto adicionada');
  });
}

/* ---------- início ---------- */
async function boot(){
  if(window.top!==window.self && !String(location.hash).startsWith('#p-')){ document.body.innerHTML='<p style="font:16px system-ui;padding:24px">Por segurança, abra o Cardápio NFC diretamente: <a href="'+location.href.replace(/"/g,'')+'" target="_top">'+location.host+'</a></p>'; return; }
  try{ await loadSession(); }catch(e){ console.error(e); }
  db.ready=true; render();
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT' && db.session){ db.session=null; db.users={}; db.pages=[]; render(); } });
}
boot();
</script>
